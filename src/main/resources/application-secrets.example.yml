# Copy this file to application-secrets.yml for local development only.
# Do not commit real secrets. Online deployment should prefer environment variables from .env or the host.
# Keep only keys that have real values; blank optional keys override the fallback chain in application.yml.

spring:
  datasource:
    # url/username can be omitted when using the dev profile defaults.
    username: ""
    password: ""
  rabbitmq:
    username: ""
    password: ""
  data:
    redis:
      password: ""

# Legacy local-secret aliases used by application-dev.yml fallback placeholders.
host:
  devSqlPassword: ""
  sqlPassword: ""
  redisPassword: ""
  mqPassword: ""

huashuo:
  admin:
    username: "admin"
    password: ""
    force-reset: false

tikhub:
  api-key: ""

vidu:
  digital-human:
    api-key: ""

volcengine:
  tts:
    access-key: ""
  asr:
    access-key: ""
  subtitle:
    enabled: false
    app-id: ""
    access-token: ""
  ark:
    api-key: ""
  # Optional dedicated provider keys. Omit these sections to fall back to volcengine.ark.api-key.
  # arks:
  #   api-key: ""
  # seedance:
  #   api-key: ""
  # image:
  #   api-key: ""
  tos:
    access-key-id: ""
    secret-access-key: ""

# Built-in admin notes:
# - dev/local can fall back to admin1234 for quick local debugging.
# - prod/test require a strong HUASHUO_ADMIN_PASSWORD and reject common weak passwords.
