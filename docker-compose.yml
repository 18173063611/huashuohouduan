services:
  backend:
    build:
      context: .
    container_name: huashuo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/huashuo_ai_video?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_SQL_INIT_MODE: never
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      HUASHUO_ADMIN_USERNAME: ${HUASHUO_ADMIN_USERNAME:-admin}
      HUASHUO_ADMIN_PASSWORD: ${HUASHUO_ADMIN_PASSWORD:?Set HUASHUO_ADMIN_PASSWORD in .env}
      HUASHUO_ADMIN_FORCE_RESET: ${HUASHUO_ADMIN_FORCE_RESET:-false}
      HUASHUO_CORS_ALLOWED_ORIGINS: ${HUASHUO_CORS_ALLOWED_ORIGINS:-https://huashuoqianduan.vercel.app,http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      HUASHUO_WS_ALLOWED_ORIGINS: ${HUASHUO_WS_ALLOWED_ORIGINS:-https://huashuoqianduan.vercel.app,http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      HUASHUO_AI_TASK_PUBLISHER_ENABLED: ${HUASHUO_AI_TASK_PUBLISHER_ENABLED:-true}
      HUASHUO_AI_TASK_LISTENER_ENABLED: ${HUASHUO_AI_TASK_LISTENER_ENABLED:-true}
      HUASHUO_UPLOAD_LOCAL_ROOT: /app/data/uploads
      HUASHUO_UPLOAD_PREVIEW_PREFIX: /uploads
      HUASHUO_UPLOAD_SERVE_LOCAL_PREVIEW: ${HUASHUO_UPLOAD_SERVE_LOCAL_PREVIEW:-true}
      HUASHUO_UPLOAD_PUBLIC_BASE_URL: ${HUASHUO_UPLOAD_PUBLIC_BASE_URL:-}
      VOLCENGINE_TOS_ENABLED: ${VOLCENGINE_TOS_ENABLED:-false}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      VIDU_API_KEY: ${VIDU_API_KEY:-}
      VOLCENGINE_TTS_ACCESS_KEY: ${VOLCENGINE_TTS_ACCESS_KEY:-}
      VOLCENGINE_ASR_ACCESS_KEY: ${VOLCENGINE_ASR_ACCESS_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      VOLCENGINE_ARKS_API_KEY: ${VOLCENGINE_ARKS_API_KEY:-}
      VOLCENGINE_SEEDANCE_API_KEY: ${VOLCENGINE_SEEDANCE_API_KEY:-}
      VOLCENGINE_IMAGE_API_KEY: ${VOLCENGINE_IMAGE_API_KEY:-}
      VOLCENGINE_TOS_ACCESS_KEY_ID: ${VOLCENGINE_TOS_ACCESS_KEY_ID:-}
      VOLCENGINE_TOS_SECRET_ACCESS_KEY: ${VOLCENGINE_TOS_SECRET_ACCESS_KEY:-}
    volumes:
      - huashuo_backend_data:/app/data

  mysql:
    image: mysql:8.0
    container_name: huashuo-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: huashuo_ai_video
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - huashuo_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: huashuo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - huashuo_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: huashuo-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      TZ: Asia/Shanghai
    volumes:
      - huashuo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  huashuo_backend_data:
  huashuo_mysql_data:
  huashuo_redis_data:
  huashuo_rabbitmq_data:
