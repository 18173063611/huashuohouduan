# Local guardrails used by the local-remote profile group.
# Keep remote services available for development, but avoid slow startup work and queue consumption.

spring:
  datasource:
    hikari:
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:-1}
  rabbitmq:
    dynamic: ${SPRING_RABBITMQ_DYNAMIC:false}
    connection-timeout: ${SPRING_RABBITMQ_CONNECTION_TIMEOUT:3s}
    requested-heartbeat: ${SPRING_RABBITMQ_REQUESTED_HEARTBEAT:30s}
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          min-idle: 0
          max-wait: ${SPRING_DATA_REDIS_POOL_MAX_WAIT:1s}

huashuo:
  bootstrap:
    database-compatibility:
      enabled: ${HUASHUO_BOOTSTRAP_DATABASE_COMPATIBILITY_ENABLED:false}
  seed:
    initializer:
      enabled: ${HUASHUO_SEED_INITIALIZER_ENABLED:false}
  ai-task:
    publisher:
      enabled: ${HUASHUO_AI_TASK_PUBLISHER_ENABLED:false}
    listener:
      enabled: ${HUASHUO_AI_TASK_LISTENER_ENABLED:false}
