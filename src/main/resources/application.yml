server:
  port: ${PORT:8080}

spring:
  application:
    name: huashuohouduan
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

tikhub:
  api-key: 06I6EN85xX+KoWS8LZy02TfNKzejZ8Rt8weCsWi9XMyqrGmhDEe0RRCibA==
volcengine:
  tts:
    # 火山「异步长文本语音合成」openspeech
    app-id: ${VOLCENGINE_TTS_APP_ID:5274450912}
    access-key: ${VOLCENGINE_TTS_ACCESS_KEY:Z_2z_JxZBdtB4PjdSsvf5A8-_rRLFc7a}
    resource-id: ${VOLCENGINE_TTS_RESOURCE_ID:volc.service_type.10029}
    submit-url: ${VOLCENGINE_TTS_SUBMIT_URL:https://openspeech.bytedance.com/api/v3/tts/submit}
    query-url: ${VOLCENGINE_TTS_QUERY_URL:https://openspeech.bytedance.com/api/v3/tts/query}
  asr:
    app-key: ${VOLCENGINE_ASR_APP_KEY:5274450912}
    access-key: ${VOLCENGINE_ASR_ACCESS_KEY:Z_2z_JxZBdtB4PjdSsvf5A8-_rRLFc7a}
    cluster: ${VOLCENGINE_ASR_CLUSTER:volc_auc_common}
  ark:
    base-url: ${VOLCENGINE_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${VOLCENGINE_ARK_API_KEY:ark-8c35f2eb-52c1-4687-a78d-6701227310cb-b7e70}
    model: ${VOLCENGINE_ARK_MODEL:doubao-seed-2-0-mini-260215}
  image:
    # 火山方舟 Doubao-Seedream-5.0-lite 图片生成，数字人形象生成/定制使用。
    base-url: ${VOLCENGINE_IMAGE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${VOLCENGINE_IMAGE_API_KEY:ark-8c35f2eb-52c1-4687-a78d-6701227310cb-b7e70}
    model: ${VOLCENGINE_IMAGE_MODEL:doubao-seedream-5-0-260128}
    default-size: ${VOLCENGINE_IMAGE_DEFAULT_SIZE:2K}
    watermark: ${VOLCENGINE_IMAGE_WATERMARK:true}

huashuo:
  upload:
    local-root: ./data/uploads
    preview-prefix: /uploads
    # 第三方图生图接口只能读取公网 URL；本地开发未配置时，参考图会要求先改用无参考图生成。
    public-base-url: ${HUASHUO_UPLOAD_PUBLIC_BASE_URL:}

# MyBatis-Plus：基础 CRUD 与分页；逻辑删除字段与表 deleted 列一致。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
