server:
  port: 8080

spring:
  application:
    name: huashuohouduan
  # 默认 dev：内存 H2，本地不装 MySQL 也能启动；连真实库时设置 SPRING_PROFILES_ACTIVE=mysql
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

huashuo:
  upload:
    local-root: ./data/uploads
    preview-prefix: /uploads

# MyBatis-Plus：基础 CRUD 与分页；逻辑删除字段与表 deleted 列一致。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
