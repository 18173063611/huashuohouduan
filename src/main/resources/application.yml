server:
  port: ${PORT:8080}

spring:
  application:
    name: huashuohouduan
  # TOS 等敏感项见 application-secrets.yml（已 .gitignore）；复制 application-secrets.yml.example 为 application-secrets.yml 后填写。
  # 密钥仅在 application-secrets.yml；环境变量 VOLCENGINE_TOS_ACCESS_KEY_ID / VOLCENGINE_TOS_SECRET_ACCESS_KEY 亦可绑定到 volcengine.tos.*（不必写在 application.yml）。
  config:
    import: optional:classpath:application-secrets.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: []
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

tikhub:
  # api-key 放在 application-secrets.yml
volcengine:
  tts:
    # 火山「异步长文本语音合成」openspeech
    app-id: ${VOLCENGINE_TTS_APP_ID:5274450912}
    # access-key 放在 application-secrets.yml
    resource-id: ${VOLCENGINE_TTS_RESOURCE_ID:volc.service_type.10029}
    submit-url: ${VOLCENGINE_TTS_SUBMIT_URL:https://openspeech.bytedance.com/api/v3/tts/submit}
    query-url: ${VOLCENGINE_TTS_QUERY_URL:https://openspeech.bytedance.com/api/v3/tts/query}
  asr:
    app-key: ${VOLCENGINE_ASR_APP_KEY:5274450912}
    # access-key 放在 application-secrets.yml
    cluster: ${VOLCENGINE_ASR_CLUSTER:volc_auc_common}
  ark:
    base-url: ${VOLCENGINE_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    # api-key 放在 application-secrets.yml
    model: ${VOLCENGINE_ARK_MODEL:doubao-seed-2-0-mini-260215}
  image:
    # 火山方舟 Doubao-Seedream-5.0-lite 图片生成，数字人形象生成/定制使用。
    base-url: ${VOLCENGINE_IMAGE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    # api-key 放在 application-secrets.yml
    model: ${VOLCENGINE_IMAGE_MODEL:doubao-seedream-5-0-260128}
    default-size: ${VOLCENGINE_IMAGE_DEFAULT_SIZE:2K}
    watermark: ${VOLCENGINE_IMAGE_WATERMARK:true}
  # 对象存储 TOS：密钥写在 application-secrets.yml（勿提交）；也可用下方环境变量注入。复制 application-secrets.yml.example 为 application-secrets.yml。
  tos:
    enabled: ${VOLCENGINE_TOS_ENABLED:true}
    region: ${VOLCENGINE_TOS_REGION:cn-guangzhou}
    endpoint: ${VOLCENGINE_TOS_ENDPOINT:tos-cn-guangzhou.volces.com}
    bucket: ${VOLCENGINE_TOS_BUCKET:ceshichucun}
    public-base-url: ${VOLCENGINE_TOS_PUBLIC_BASE_URL:https://ceshichucun.tos-cn-guangzhou.volces.com}

huashuo:
  upload:
    local-root: ./data/uploads
    preview-prefix: /uploads
    # 第三方图生图接口只能读取公网 URL。未设置时，若 volcengine.tos.enabled=true 则使用 TOS 的 public-base-url。
    public-base-url: ${HUASHUO_UPLOAD_PUBLIC_BASE_URL:}

# MyBatis-Plus：基础 CRUD 与分页；逻辑删除字段与表 deleted 列一致。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
