spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/huashuodemo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 结构由手工执行 schema.sql 维护，避免启动时重复初始化。
      mode: never
      # 兼容外部把 init.mode 改成 always 的场景，优先使用项目根目录 sql/schema.sql。
      schema-locations: optional:file:./sql/schema.sql

ffmpeg:
  executable: 'C:\Program Files (x86)\EVEncrypt2\ffmpeg.exe'
