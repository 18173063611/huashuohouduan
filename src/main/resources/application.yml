server:
  port: ${PORT:8080}

spring:
  application:
    name: huashuohouduan
  profiles:
    # Local default is dev; online deployments must set SPRING_PROFILES_ACTIVE=prod explicitly.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/huashuo_ai_video?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  # AI 任务队列 broker；未启动时 SimpleMessageListenerContainer 会持续重连并报 AmqpConnectException。
  # 本地一键启动：在 huashuohouduan 目录执行 docker compose up -d rabbitmq（管理台 http://localhost:15672 ，默认 guest/guest）。
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:147352}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: []
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:false}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  mvc:
    async:
      request-timeout: ${HUASHUO_MVC_ASYNC_REQUEST_TIMEOUT:10m}

tikhub:
  base-url: ${TIKHUB_BASE_URL:https://api.tikhub.io}
  api-key: ${TIKHUB_API_KEY:}

vidu:
  digital-human:
    api-key: ${VIDU_API_KEY:}
    base-url: ${VIDU_BASE_URL:https://api.vidu.cn}
    model: ${VIDU_DIGITAL_HUMAN_MODEL:viduq2-turbo}
    resolution: ${VIDU_DIGITAL_HUMAN_RESOLUTION:720p}
    poll-interval-seconds: ${VIDU_DIGITAL_HUMAN_POLL_INTERVAL:5}
    poll-timeout-seconds: ${VIDU_DIGITAL_HUMAN_POLL_TIMEOUT:900}

volcengine:
  tts:
    app-id: ${VOLCENGINE_TTS_APP_ID:5274450912}
    access-key: ${VOLCENGINE_TTS_ACCESS_KEY:}
    resource-id: ${VOLCENGINE_TTS_RESOURCE_ID:volc.service_type.10029}
    submit-url: ${VOLCENGINE_TTS_SUBMIT_URL:https://openspeech.bytedance.com/api/v3/tts/submit}
    query-url: ${VOLCENGINE_TTS_QUERY_URL:https://openspeech.bytedance.com/api/v3/tts/query}
  asr:
    app-key: ${VOLCENGINE_ASR_APP_KEY:5274450912}
    access-key: ${VOLCENGINE_ASR_ACCESS_KEY:}
    cluster: ${VOLCENGINE_ASR_CLUSTER:volc_auc_common}
  ark:
    base-url: ${VOLCENGINE_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${VOLCENGINE_ARK_API_KEY:}
    model: ${VOLCENGINE_ARK_MODEL:doubao-seed-2-0-mini-260215}
  arks:
    base-url: ${VOLCENGINE_ARKS_BASE_URL:${VOLCENGINE_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}}
    api-key: ${VOLCENGINE_ARKS_API_KEY:${volcengine.ark.api-key:${VOLCENGINE_ARK_API_KEY:}}}
    video-model: ${VOLCENGINE_ARKS_VIDEO_MODEL:doubao-seed-2-0-lite-260215}
    video-fps: ${VOLCENGINE_ARKS_VIDEO_FPS:1.0}
    video-transfer:
      max-bytes: ${VOLCENGINE_ARKS_VIDEO_TRANSFER_MAX_BYTES:52428800}
      connect-timeout-seconds: ${VOLCENGINE_ARKS_VIDEO_TRANSFER_CONNECT_TIMEOUT_SECONDS:15}
      read-timeout-seconds: ${VOLCENGINE_ARKS_VIDEO_TRANSFER_READ_TIMEOUT_SECONDS:60}
  seedance:
    base-url: ${VOLCENGINE_SEEDANCE_BASE_URL:${VOLCENGINE_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}}
    api-key: ${VOLCENGINE_SEEDANCE_API_KEY:${volcengine.ark.api-key:${VOLCENGINE_ARK_API_KEY:}}}
    model: ${VOLCENGINE_SEEDANCE_MODEL:doubao-seedance-1-5-pro-251215}
    reference-model: ${VOLCENGINE_SEEDANCE_REFERENCE_MODEL:ep-20260508095146-t6fgw}
    poll-interval-seconds: ${VOLCENGINE_SEEDANCE_POLL_INTERVAL:5}
    poll-timeout-seconds: ${VOLCENGINE_SEEDANCE_POLL_TIMEOUT:1200}
    client-connect-timeout-seconds: ${VOLCENGINE_SEEDANCE_CLIENT_CONNECT_TIMEOUT_SECONDS:15}
    client-timeout-seconds: ${VOLCENGINE_SEEDANCE_CLIENT_TIMEOUT_SECONDS:60}
    client-call-timeout-seconds: ${VOLCENGINE_SEEDANCE_CLIENT_CALL_TIMEOUT_SECONDS:120}
    client-retry-times: ${VOLCENGINE_SEEDANCE_CLIENT_RETRY_TIMES:1}
  image:
    base-url: ${VOLCENGINE_IMAGE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${VOLCENGINE_IMAGE_API_KEY:${volcengine.ark.api-key:${VOLCENGINE_ARK_API_KEY:}}}
    model: ${VOLCENGINE_IMAGE_MODEL:doubao-seedream-5-0-260128}
    default-size: ${VOLCENGINE_IMAGE_DEFAULT_SIZE:2K}
    watermark: ${VOLCENGINE_IMAGE_WATERMARK:true}
  tos:
    enabled: ${VOLCENGINE_TOS_ENABLED:false}
    region: ${VOLCENGINE_TOS_REGION:cn-guangzhou}
    endpoint: ${VOLCENGINE_TOS_ENDPOINT:tos-cn-guangzhou.volces.com}
    bucket: ${VOLCENGINE_TOS_BUCKET:ceshichucun}
    public-base-url: ${VOLCENGINE_TOS_PUBLIC_BASE_URL:https://ceshichucun.tos-cn-guangzhou.volces.com}
    access-key-id: ${VOLCENGINE_TOS_ACCESS_KEY_ID:}
    secret-access-key: ${VOLCENGINE_TOS_SECRET_ACCESS_KEY:}

huashuo:
  jwt:
    secret: ${HUASHUO_JWT_SECRET:}
    access-token-ttl-seconds: ${HUASHUO_JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
  auth:
    session:
      redis-required: ${HUASHUO_AUTH_SESSION_REDIS_REQUIRED:true}
      stateless-fallback-enabled: ${HUASHUO_AUTH_SESSION_STATELESS_FALLBACK_ENABLED:false}
      redis-circuit-breaker-seconds: ${HUASHUO_AUTH_SESSION_REDIS_CIRCUIT_BREAKER_SECONDS:15}
  cors:
    allowed-origins: ${HUASHUO_CORS_ALLOWED_ORIGINS:https://kcpq.site,http://kcpq.site,http://101.47.67.115,https://huashuoqianduan.vercel.app,http://localhost:5173,http://127.0.0.1:5173}
  websocket:
    allowed-origins: ${HUASHUO_WS_ALLOWED_ORIGINS:${huashuo.cors.allowed-origins}}
  admin:
    user-ids: ${HUASHUO_ADMIN_USER_IDS:}
    usernames: ${HUASHUO_ADMIN_USERNAMES:}
    # 内置管理员（与 HUASHUO_ADMIN_* 对应）；密码仅用于启动期写入 BCrypt，勿写入日志。
    username: ${HUASHUO_ADMIN_USERNAME:admin}
    password: ${HUASHUO_ADMIN_PASSWORD:}
    force-reset: ${HUASHUO_ADMIN_FORCE_RESET:false}

  upload:
    local-root: ${HUASHUO_UPLOAD_LOCAL_ROOT:./data/uploads}
    preview-prefix: ${HUASHUO_UPLOAD_PREVIEW_PREFIX:/uploads}
    serve-local-preview: ${HUASHUO_UPLOAD_SERVE_LOCAL_PREVIEW:false}
    public-base-url: ${HUASHUO_UPLOAD_PUBLIC_BASE_URL:}

  ai-task:
    backlog-dispatch:
      enabled: ${HUASHUO_AI_TASK_BACKLOG_DISPATCH_ENABLED:true}
      max-items: ${HUASHUO_AI_TASK_BACKLOG_DISPATCH_MAX_ITEMS:50}
      lookback-hours: ${HUASHUO_AI_TASK_BACKLOG_DISPATCH_LOOKBACK_HOURS:24}
      stale-running-minutes: ${HUASHUO_AI_TASK_STALE_RUNNING_MINUTES:35}
      stale-scan-initial-delay-ms: ${HUASHUO_AI_TASK_STALE_SCAN_INITIAL_DELAY_MS:120000}
      stale-scan-interval-ms: ${HUASHUO_AI_TASK_STALE_SCAN_INTERVAL_MS:300000}
    publisher:
      enabled: ${HUASHUO_AI_TASK_PUBLISHER_ENABLED:true}
    listener:
      regular:
        concurrent-consumers: ${HUASHUO_AI_TASK_REGULAR_CONSUMERS:3}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_REGULAR_MAX_CONSUMERS:8}
        prefetch-count: ${HUASHUO_AI_TASK_REGULAR_PREFETCH:1}
      tts:
        concurrent-consumers: ${HUASHUO_AI_TASK_TTS_CONSUMERS:3}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_TTS_MAX_CONSUMERS:6}
        prefetch-count: ${HUASHUO_AI_TASK_TTS_PREFETCH:1}
      writer:
        concurrent-consumers: ${HUASHUO_AI_TASK_WRITER_CONSUMERS:2}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_WRITER_MAX_CONSUMERS:5}
        prefetch-count: ${HUASHUO_AI_TASK_WRITER_PREFETCH:1}
      video:
        concurrent-consumers: ${HUASHUO_AI_TASK_VIDEO_CONSUMERS:2}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_VIDEO_MAX_CONSUMERS:4}
        prefetch-count: ${HUASHUO_AI_TASK_VIDEO_PREFETCH:1}
      avatar:
        concurrent-consumers: ${HUASHUO_AI_TASK_AVATAR_CONSUMERS:1}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_AVATAR_MAX_CONSUMERS:3}
        prefetch-count: ${HUASHUO_AI_TASK_AVATAR_PREFETCH:1}
      douyin-parse-transcript:
        concurrent-consumers: ${HUASHUO_AI_TASK_DOUYIN_PARSE_CONSUMERS:1}
        max-concurrent-consumers: ${HUASHUO_AI_TASK_DOUYIN_PARSE_MAX_CONSUMERS:2}
        prefetch-count: ${HUASHUO_AI_TASK_DOUYIN_PARSE_PREFETCH:1}
    limits:
      enabled: ${HUASHUO_AI_TASK_LIMITS_ENABLED:true}
      max-active-global: ${HUASHUO_AI_TASK_MAX_ACTIVE_GLOBAL:500}
      max-active-per-user: ${HUASHUO_AI_TASK_MAX_ACTIVE_PER_USER:10}
      max-active-heavy-per-user: ${HUASHUO_AI_TASK_MAX_ACTIVE_HEAVY_PER_USER:3}
    execution:
      default-max-concurrent: ${HUASHUO_AI_TASK_DEFAULT_MAX_CONCURRENT:4}
      max-concurrent-by-task-type:
        TTS_GENERATE: ${HUASHUO_AI_TASK_TTS_MAX_CONCURRENT:4}
        VOICE_SAMPLE: ${HUASHUO_AI_TASK_VOICE_SAMPLE_MAX_CONCURRENT:4}
        AVATAR_GENERATE: ${HUASHUO_AI_TASK_AVATAR_MAX_CONCURRENT:2}
        VIDEO_SCRIPT_ANALYZE: ${HUASHUO_AI_TASK_VIDEO_SCRIPT_MAX_CONCURRENT:3}
        VIDEO_SCRIPT_URL_ANALYZE: ${HUASHUO_AI_TASK_VIDEO_SCRIPT_URL_MAX_CONCURRENT:3}
        DOUYIN_REWRITE: ${HUASHUO_AI_TASK_DOUYIN_REWRITE_MAX_CONCURRENT:3}
        DOUYIN_TRANSCRIPT: ${HUASHUO_AI_TASK_DOUYIN_TRANSCRIPT_MAX_CONCURRENT:3}
        DOUYIN_PARSE_TRANSCRIPT: ${HUASHUO_AI_TASK_DOUYIN_PARSE_TRANSCRIPT_MAX_CONCURRENT:2}
        SEEDANCE_TEXT_VIDEO: ${HUASHUO_AI_TASK_SEEDANCE_TEXT_MAX_CONCURRENT:2}
        SEEDANCE_FIRST_FRAME_VIDEO: ${HUASHUO_AI_TASK_SEEDANCE_FIRST_FRAME_MAX_CONCURRENT:2}
        SEEDANCE_FIRST_LAST_FRAME_VIDEO: ${HUASHUO_AI_TASK_SEEDANCE_FIRST_LAST_FRAME_MAX_CONCURRENT:2}
        SEEDANCE_REFERENCE_VIDEO: ${HUASHUO_AI_TASK_SEEDANCE_REFERENCE_MAX_CONCURRENT:2}
        SEEDANCE_CAR_SALES_VIDEO: ${HUASHUO_AI_TASK_SEEDANCE_CAR_SALES_MAX_CONCURRENT:2}
        DIGITAL_HUMAN_GENERATE: ${HUASHUO_AI_TASK_DIGITAL_HUMAN_MAX_CONCURRENT:1}

  bootstrap:
    database-compatibility:
      enabled: ${HUASHUO_BOOTSTRAP_DATABASE_COMPATIBILITY_ENABLED:true}
  seed:
    initializer:
      enabled: ${HUASHUO_SEED_INITIALIZER_ENABLED:true}

writer:
  douyin-parse:
    max-requests-per-minute: ${HUASHUO_WRITER_DOUYIN_PARSE_MAX_REQUESTS_PER_MINUTE:20}
  audio-preprocess:
    source-video-max-bytes: ${HUASHUO_WRITER_AUDIO_SOURCE_VIDEO_MAX_BYTES:524288000}
    download-timeout-seconds: ${HUASHUO_WRITER_AUDIO_DOWNLOAD_TIMEOUT_SECONDS:300}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
