server:
  port: 8080

spring:
  application:
    name: huashuohouduan
  datasource:
    url: jdbc:h2:mem:huashuo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

huashuo:
  upload:
    local-root: ./data/uploads
    preview-prefix: /uploads
