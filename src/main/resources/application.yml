server:
  port: 8080

spring:
  application:
    name: huashuohouduan
  # Default dev profile: in-memory H2, no MySQL required for local development
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

huashuo:
  upload:
    local-root: ./data/uploads
    preview-prefix: /uploads

# MyBatis-Plus: basic CRUD and pagination; logical delete field matches table column 'deleted'
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
